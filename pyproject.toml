[project]
name = "vla-network-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.5.1",
    "debugpy>=1.8.18",
    "flash-attn",
    "joblib==1.5.0",
    "lerobot==0.4.2",
    "matplotlib>=3.10.8",
    "numpy>=1.26.4",
    "omegaconf==2.3.0",
    "open3d==0.19.0",
    "opencv-python==4.11.0.86",
    "pandas==2.2.3",
    "pygments>=2.19.2",
    "pyzmq==26.3.0",
    "sentencepiece==0.2.0",
    "timm==1.0.15",
    "torch==2.7.1",
    "torchaudio",
    "torchcodec==0.5",
    "torchvision",
    "tqdm>=4.67.1",
    "transformations==2025.1.1",
    "transformers==4.57.0",
    "transforms3d>=0.4.2",
    "urchin>=0.0.30",
    "wandb==0.21.1",
    "msgpack_numpy",
    "websockets",
]

[tool.uv]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
override-dependencies = [
    "numpy==1.26.4",
]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.7cxx11abiFALSE-cp312-cp312-linux_x86_64.whl" }
